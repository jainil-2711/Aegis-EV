version: "3.9"

# Optional Postgres for the full-team demo (architecture.md SS3). Not
# required to run individual modules locally — SQLite is the default in
# .env.example for zero-setup development.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencharge
      POSTGRES_PASSWORD: greencharge
      POSTGRES_DB: greencharge
    ports:
      - "5432:5432"
    volumes:
      - greencharge_pgdata:/var/lib/postgresql/data

volumes:
  greencharge_pgdata:
